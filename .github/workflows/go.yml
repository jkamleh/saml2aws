name: Go

# Manual only. Pushes, pull requests and fork syncs never start CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.repository == 'jkamleh/saml2aws' && github.actor == 'jkamleh' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, macos-13]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Test
        run: |
          go test -v ./... -coverprofile=${{ matrix.os }}_coverage.txt -covermode=atomic

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}_reports
          path: ${{ matrix.os }}_coverage.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install
        run: go install ./cmd/saml2aws

  linting:
    name: lint
    if: github.repository == 'jkamleh/saml2aws' && github.actor == 'jkamleh' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          args: --timeout=2m

  release-build:
    name: release-build
    if: github.repository == 'jkamleh/saml2aws' && github.actor == 'jkamleh' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install dependency required for linux builds
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean --config .goreleaser.${{ matrix.os }}.yml

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}_saml2aws
          path: dist/
